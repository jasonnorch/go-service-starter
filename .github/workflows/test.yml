name: Tests

# Runs on pull requests, and as a reusable workflow so anything that builds or
# publishes can call it rather than shipping untested code.
#
# Deliberately no `push` trigger on branches: a PR already runs this, and adding
# one would run the whole suite twice for every push.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # checkout leaves GITHUB_TOKEN in .git/config by default, where any
          # later step — including third-party actions — can read it. Nothing
          # in this job talks to the remote, so it is not needed.
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          # Read from go.mod, so the CI toolchain cannot drift from the one the
          # module declares.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # -diff reports the drift without causing it, so the check cannot leave a
      # dirty tree behind the way `go mod tidy` would.
      - name: go mod tidy is clean
        run: go mod tidy -diff

      # -tags integration so the integration tests are compiled and vetted here
      # too. They only run in the job below, which needs a database; a change
      # that breaks their build should still fail the fast job.
      - name: go vet
        run: go vet -tags integration ./...

      - name: Build
        run: go build ./...

      # Installed from source rather than through a third-party action: fewer
      # external actions running in a job that holds a repository token. The
      # version is pinned so CI cannot start failing because upstream enabled a
      # new check — bump it deliberately.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      # The whole tree, not just new findings. This repo starts with no backlog,
      # and the point of a starter is that it stays that way.
      #
      # The issue caps are disabled for the same reason as in the Makefile:
      # golangci-lint reports at most 50 per linter and 3 per identical message
      # by default, which on a gate means a PR can pass having been told about
      # only some of what it introduced.
      - name: golangci-lint
        run: golangci-lint run --timeout 10m --max-issues-per-linter=0 --max-same-issues=0 --build-tags integration ./...

      # -race because the server, the health checks and the shutdown path are
      # all concurrent, and a data race that only shows up under load is not
      # something to find in production. -count=1 defeats the test cache, so a
      # green run means the tests actually ran.
      - name: Test
        run: go test -race -count=1 ./...

  # module:postgres+cache begin
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # The same images and credentials as compose.yaml, so a test that passes
    # under `make test-integration` passes here for the same reasons.
    services:
      # module:postgres begin
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      # module:postgres end
      # module:cache begin
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      # module:cache end
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The integration tests fail rather than skip without their URL, so a
      # missing service here is a red job, not a green one that tested nothing.
      - name: Integration tests
        env:
          POSTGRES_URL: postgres://app:app@localhost:5432/app?sslmode=disable # module:postgres
          CACHE_REDIS_URL: redis://localhost:6379/0 # module:cache
        run: go test -race -count=1 -tags integration ./...
  # module:postgres+cache end

  # Every `./setup.sh --without` a fork could run, each in a scratch copy, held
  # to what the fork's own `make verify` would check. Without this, a removal
  # that leaves a dangling import is discovered by the first person to use it.
  without:
    name: Every module removal verifies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Remove each module, then all of them
        run: make verify-without

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Builds only — nothing is pushed. A Dockerfile that stops building is
      # otherwise discovered at deploy time, which is the worst moment for it.
      - name: Build image
        run: docker build --build-arg VERSION=ci -t go-service-starter:ci .
