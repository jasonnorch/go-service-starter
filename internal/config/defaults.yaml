# Built-in defaults for every configuration key.
#
# This file is embedded into the binary, so the service starts and runs
# correctly with no config file and no environment variables set. It is also the
# documentation: config.example.yaml is a symlink to it, which is what stops the
# defaults, the docs, and the example from drifting apart.
#
# Two things override it, in order:
#
#   1. ./config.yaml, or the file named by $CONFIG_FILE. Override-only — it does
#      not need to be complete, and it is not required to exist.
#   2. Environment variables, named by upper-casing the key and replacing dots
#      with underscores: server.read_timeout becomes SERVER_READ_TIMEOUT.
#
# Every key must appear here even when its zero value would do. Reading this
# file is what registers the key with the config loader, and an unregistered key
# cannot be set by an environment variable.

service:
  # Identifies the service in logs and in the /info response. Set by ./setup.sh,
  # which anchors on this line's exact indentation and shape.
  name: go-service-starter

  # "development" or "production". Only affects defaults that would be unsafe or
  # unhelpful in the other mode; it is never a switch for business logic.
  environment: development

server:
  port: 8080

  # Time to read the whole request, headers and body. Deliberately short: a slow
  # client holding a connection open is the cheapest denial of service there is.
  read_timeout: 10s

  # Time to write the response. Raise this if you add a long-running endpoint —
  # it is the ceiling on a handler's total runtime, and exceeding it truncates
  # the response with no error the client can distinguish from a network fault.
  write_timeout: 30s

  # How long an idle keep-alive connection is kept.
  idle_timeout: 60s

  # Grace period for in-flight requests to finish after a shutdown signal.
  #
  # Deliberately *shorter* than write_timeout, which does mean a request that
  # began just before the signal and then used its full write window is cut off.
  # That trade is forced from outside: an orchestrator sends SIGKILL a fixed time
  # after SIGTERM — 30s by default on Kubernetes — so a grace period at or above
  # write_timeout would not be honored anyway. The process would be killed
  # mid-drain instead of closing its own connections, which is strictly worse:
  # nothing gets to finish and nothing gets logged.
  #
  # Raise this only together with terminationGracePeriodSeconds (or whatever
  # your platform calls it), and keep it comfortably below that number.
  shutdown_timeout: 15s

  # Maximum accepted request body, in bytes. Enforced by middleware, which
  # rejects anything larger with 413 rather than reading it into memory.
  body_limit: 1048576 # 1 MiB

log:
  # debug, info, warn, or error.
  level: info

  # "text" for human-readable output, "json" for structured output that a log
  # aggregator can parse. Use json in production.
  format: text

  # Include the source file and line on every record. Useful while developing,
  # noisy and measurably slower in production.
  add_source: false

postgres:
  # A libpq connection string. The default is the database compose.yaml runs
  # (`make up`); production rejects it, so set POSTGRES_URL there. The password
  # is never logged.
  url: postgres://app:app@localhost:5432/app?sslmode=disable

  # Upper bound on open connections from this instance. Multiply by the number
  # of instances and keep the result under the server's max_connections.
  max_conns: 10

  # How long startup waits to reach the database before giving up. Startup
  # fails rather than serving without a database.
  connect_timeout: 10s

  # Apply pending migrations (internal/postgres/migrations) before serving.
  # Concurrent instances take a Postgres advisory lock: one migrates, and the
  # rest wait for it, polling every 5s. Turn off if migrations run as a
  # separate deploy step.
  migrate_on_start: true
