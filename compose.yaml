# Local dependencies for `make run` and `make test-integration`. Start with
# `make up`, stop with `make down`. Nothing here is used by `make verify`, which
# needs no containers.
#
# The credentials match postgres.url's default in internal/config/defaults.yaml.
# They are for this local container only; production rejects that default.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      # `make up` waits on this, so a test run never races the server's startup.
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15
